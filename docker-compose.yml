services:
  my-finance-tracker:
    container_name: my-finance-tracker
    ports:
      - "${PORT:-4242}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-false}
      - ALLOW_UNVERIFIED_REGISTRATION=${ALLOW_UNVERIFIED_REGISTRATION:-false}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - NODE_ENV=${NODE_ENV:-production}
      - APP_URL=${APP_URL:-}
      - BREVO_SMTP_HOST=${BREVO_SMTP_HOST:-smtp-relay.brevo.com}
      - BREVO_SMTP_PORT=${BREVO_SMTP_PORT:-587}
      - BREVO_SMTP_SECURE=${BREVO_SMTP_SECURE:-false}
      - BREVO_SMTP_USER=${BREVO_SMTP_USER:-}
      - BREVO_SMTP_KEY=${BREVO_SMTP_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
    restart: unless-stopped
